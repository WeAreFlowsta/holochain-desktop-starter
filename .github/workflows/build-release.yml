name: Build Release

# Tag-driven release. Push a `v<version>` tag to build and publish installers
# for Linux, macOS (Intel and Apple Silicon) and Windows. A version with a
# hyphen (v1.2.0-beta.1, v1.2.0-rc.1) is published as a pre-release. Write a
# pre-release as a word, a dot and a number: the updater compares versions
# by semver, where "beta10" sorts below "beta9".
#
# RELEASING.md is the guide: what each secret is, and the step after this
# workflow (signing the release manifest), without which no installed copy
# takes the update.
#
# Every secret is optional. With none set, the build is unsigned, runs on
# the public Holochain test servers and has no Flowsta client id: enough to
# try the release path, not what you ship.
#   VITE_FLOWSTA_CLIENT_ID    your app's client id from dev.flowsta.com
#   STARTER_BOOTSTRAP_URL     your bootstrap server, e.g. https://bootstrap.example.org
#   STARTER_RELAY_URL         only when your relay is on another host: https://relay.example.org./
#   STARTER_AUTH_MATERIAL     standard base64 (with = padding) of the bytes your
#                             bootstrap's authentication hook expects, if it has one
#   TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD)   the updater's key
#   APPLE_*                   macOS signing and notarization
#   ESIGNER_*                 Windows code signing (SSL.com eSigner)

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    # Drive the release-notes signing line from what's actually configured.
    # WINDOWS_SIGNED is 'true' only when the eSigner secrets exist (this repo);
    # without them the Windows build is said to be unsigned. The publisher
    # name is not written here: set a `WINDOWS_PUBLISHER` repository variable
    # (Settings, Secrets and variables, Actions, Variables) to your own.
    env:
      WINDOWS_SIGNED: ${{ secrets.ESIGNER_USERNAME != '' }}
      WINDOWS_PUBLISHER: ${{ vars.WINDOWS_PUBLISHER }}
      MACOS_SIGNED: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      # The release notes are this version's block in CHANGELOG.md (from
      # "## [<version>]" to the next "## [" heading). A release without one
      # stops here rather than publishing an empty page.
      - name: What's new, from the changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v head="## [${VERSION}]" '
            index($0, head) == 1 { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > /tmp/whats-new.md
          if ! grep -q '[^[:space:]]' /tmp/whats-new.md; then
            echo "::error::CHANGELOG.md has no entry for ${VERSION} (a '## [${VERSION}] - <date>' heading)"
            exit 1
          fi
          cat /tmp/whats-new.md

      - name: Create GitHub Release
        id: create-release
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const version = "${{ steps.version.outputs.version }}";
            const whatsNew = fs.readFileSync('/tmp/whats-new.md', 'utf8').trim();
            // v1.4.0 is stable; -beta.N and -rc.N are pre-releases. Marking pre-releases correctly keeps them out
            // of GitHub's "Latest" slot when published.
            const isPrerelease = version.includes('-');
            // Describe each platform's bundle honestly based on whether
            // signing is actually configured for THIS repo (see job env).
            // Betas skip Windows signing and the MSI (see "Detect beta
            // build" in the build job), so their line says so.
            const isBeta = version.includes('-beta');
            const winSigned = process.env.WINDOWS_SIGNED === 'true' && !isBeta;
            const winPublisher = (process.env.WINDOWS_PUBLISHER || '').trim();
            const macSigned = process.env.MACOS_SIGNED === 'true';
            const windowsLine = winSigned
              ? `- **Windows:** \`.exe\` installer or \`.msi\`${winPublisher ? ` (code-signed; verified publisher **${winPublisher}**)` : ' (code-signed)'}`
              : isBeta
                ? '- **Windows:** `.exe` installer (beta builds are not code-signed, so SmartScreen shows a warning on first launch; verify via `SHA256SUMS.txt`)'
                : '- **Windows:** `.exe` installer or `.msi` (unsigned, so SmartScreen shows a warning on first launch; verify via `SHA256SUMS.txt` or build from source)';
            const macLine = macSigned
              ? '- **macOS:** `.dmg` (Intel or Apple Silicon, signed and notarized)'
              : '- **macOS:** `.dmg` (Intel or Apple Silicon; unsigned, so Gatekeeper requires right-click, Open on first launch)';
            const name = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8')).productName;
            const body = [
              `## ${name} v${version}`,
              '',
              "### What's new in this release",
              whatsNew,
              '',
              '### Downloads',
              'Pick your platform from the assets below:',
              '- **Linux:** `.deb` or `.rpm`; betas ship `.deb` only (AppImage is not provided: its sandboxing breaks the embedded Holochain conductor)',
              macLine,
              windowsLine,
              '',
              "**Verify your download (optional):** `sha256sum -c SHA256SUMS.txt` (Linux) or `shasum -a 256 -c SHA256SUMS.txt` (macOS).",
            ].join('\n');
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: `${name} v${version}`,
              body,
              draft: true,
              prerelease: isPrerelease,
            });
            return data.id;

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          # Pinned to windows-2022 (Visual Studio 2022): a newer image has
          # broken the build of aws-lc-sys before.
          - platform: windows-2022
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    # Job-level env exposes secrets so that step-level `if:` conditionals
    # can check for them (step-level env is evaluated AFTER the if, so
    # secrets only set there can't gate the step itself).
    #
    # The STARTER_* values are read by src-tauri/src/conductor.rs at compile
    # time; empty ones fall back to the public Holochain test servers with
    # no auth. The APPLE_* and ESIGNER_* values are checked by the signing
    # steps below: without them the bundles are unsigned and no step fails.
    env:
      STARTER_BOOTSTRAP_URL: ${{ secrets.STARTER_BOOTSTRAP_URL }}
      STARTER_RELAY_URL: ${{ secrets.STARTER_RELAY_URL }}
      STARTER_AUTH_MATERIAL: ${{ secrets.STARTER_AUTH_MATERIAL }}
      VITE_FLOWSTA_CLIENT_ID: ${{ secrets.VITE_FLOWSTA_CLIENT_ID }}
      # The Apple secrets reach the build under Tauri's own names
      # (APPLE_*) only when they are set: the two macOS steps below export
      # them. Tauri treats an APPLE_CERTIFICATE that is present but empty as
      # a certificate to import, and the macOS build then fails, so a
      # repository with no Apple secrets must not carry the names at all.
      MACOS_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      MACOS_API_KEY: ${{ secrets.APPLE_API_KEY }}
      # APPLE_API_KEY_PATH is intentionally NOT exposed at job level:
      # tauri-action would otherwise pick it up as an env var and try to
      # pass the base64 contents (rather than a file path) to
      # `xcrun notarytool --key`, which fails. It's only needed by the
      # "Set up Apple API key" step below, where it's set step-scoped.
      MACOS_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
      ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
      ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
      ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}

    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # Node 22: the build tools need 22.19 or later (undici 8); Node 20 ended
      # in April 2026.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # rust-toolchain.toml pins the compiler; rustup installs that toolchain
      # with the host target only, so the matrix target is added to it here
      # (an Intel macOS build on an Apple silicon runner fails without it).
      - name: Add the build target to the pinned toolchain
        run: rustup target add ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      # The conductor and its key store, fetched as released binaries (no
      # compile from source), each checked against the SHA-256 pinned in
      # .github/holochain-sidecars.sha256: a replaced release asset never
      # reaches an installer.
      #
      # The conductor is Holochain 0.7.1 with the patches listed at
      # https://github.com/WeAreFlowsta/holochain-build (README, "The
      # conductor you ship", says what they are and how to ship the official
      # binary instead); the key store is the official 0.7.1 release.
      #
      # They are saved under the names tauri.conf.json's externalBin lists
      # (the app's own prefix keeps them from colliding with another
      # Holochain app's), so a renamed app needs no change here.
      - name: Fetch Holochain binaries (Unix)
        if: runner.os != 'Windows'
        env:
          HC_RELEASE: holochain-0.7.1
          HC_BUILD: holochain-0.7.1-flowsta.4
        run: |
          mkdir -p src-tauri/binaries
          ours() { node -e 'const b = require("./src-tauri/tauri.conf.json").bundle.externalBin.find((x) => x.endsWith(process.argv[1])); if (!b) process.exit(1); console.log(b)' -- "$1"; }
          pinned() { awk -v k="$1" '$1 !~ /^#/ && $2 == k { print $1 }' .github/holochain-sidecars.sha256; }
          sha() { if command -v sha256sum >/dev/null; then sha256sum "$1"; else shasum -a 256 "$1"; fi | cut -d' ' -f1; }
          fetch() { # release, upstream name, the ending of our name
            case "$1" in
              *-flowsta.*) base="https://github.com/WeAreFlowsta/holochain-build/releases/download" ;;
              *) base="https://github.com/holochain/holochain/releases/download" ;;
            esac
            dest="src-tauri/$(ours "$3")-${{ matrix.target }}"
            curl -fsSL "${base}/$1/$2-${{ matrix.target }}" -o "$dest"
            chmod +x "$dest"
            w=$(pinned "$1/$2-${{ matrix.target }}"); g=$(sha "$dest")
            [ -n "$w" ] && [ "$g" = "$w" ] || { echo "$1/$2-${{ matrix.target }}: SHA-256 $g does not match the pinned ${w:-(none)}"; exit 1; }
          }
          fetch "$HC_BUILD" holochain -holochain
          fetch "$HC_RELEASE" lair-keystore -lair-keystore

      - name: Fetch Holochain binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          HC_RELEASE: holochain-0.7.1
          HC_BUILD: holochain-0.7.1-flowsta.4
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries
          $t = "${{ matrix.target }}"
          $bins = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).bundle.externalBin
          $wanted = @(
            @{ rel = $env:HC_BUILD; up = "holochain"; ours = ($bins | Where-Object { $_ -like "*-holochain" }) },
            @{ rel = $env:HC_RELEASE; up = "lair-keystore"; ours = ($bins | Where-Object { $_ -like "*-lair-keystore" }) }
          )
          function Assert-Pinned($file, $key) {
            $want = Get-Content .github/holochain-sidecars.sha256 | Where-Object { $_ -notmatch '^\s*#' } |
              ForEach-Object { $p = $_ -split '\s+'; if ($p[1] -eq $key) { $p[0] } } | Select-Object -First 1
            $got = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            if (-not $want -or $got -ne $want) { throw "${key}: SHA-256 $got does not match the pinned $want" }
          }
          foreach ($w in $wanted) {
            if (-not $w.ours) { throw "tauri.conf.json lists no sidecar for $($w.up)" }
            $base = if ($w.rel -like "*-flowsta.*") { "https://github.com/WeAreFlowsta/holochain-build/releases/download" } else { "https://github.com/holochain/holochain/releases/download" }
            $dest = "src-tauri/$($w.ours)-$t.exe"
            Invoke-WebRequest "$base/$($w.rel)/$($w.up)-$t.exe" -OutFile $dest
            Assert-Pinned $dest "$($w.rel)/$($w.up)-$t.exe"
          }

      - name: Install frontend dependencies
        run: npm install

      # macOS code signing, only runs when the Apple secrets are
      # configured. A fork without an Apple Developer account will
      # produce unsigned bundles (Gatekeeper will warn on first launch).
      - name: Import Apple certificate (macOS)
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$MACOS_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain-db
          {
            echo "APPLE_CERTIFICATE=$MACOS_CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$MACOS_CERTIFICATE_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Set up Apple API key (macOS)
        if: runner.os == 'macOS' && env.MACOS_API_KEY != ''
        # Step-scoped so APPLE_API_KEY_PATH doesn't leak into later
        # steps (tauri-action mishandles it, see job-level env note).
        env:
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
        run: |
          mkdir -p ~/private_keys
          echo -n "$APPLE_API_KEY_PATH" | base64 --decode -o ~/private_keys/AuthKey_${MACOS_API_KEY}.p8
          {
            echo "APPLE_API_KEY=$MACOS_API_KEY"
            echo "APPLE_API_ISSUER=$MACOS_API_ISSUER"
          } >> "$GITHUB_ENV"

      # Betas skip Authenticode signing (cloud signing bills per operation;
      # sign-windows.ps1 no-ops when the env below is set). Release
      # candidates and stable tags sign as always.
      - name: Detect beta build
        id: prerelease
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *-beta* ]]; then
            echo "is_beta=1" >> "$GITHUB_OUTPUT"
          else
            echo "is_beta=0" >> "$GITHUB_OUTPUT"
          fi

      # Windows code signing via SSL.com eSigner, only runs when the
      # ESIGNER secrets are configured. Without them, the Windows bundle
      # is unsigned (SmartScreen will warn on first launch).
      - name: Setup Java (Windows)
        if: runner.os == 'Windows' && env.ESIGNER_USERNAME != '' && steps.prerelease.outputs.is_beta == '0'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download CodeSignTool (Windows)
        if: runner.os == 'Windows' && env.ESIGNER_USERNAME != '' && steps.prerelease.outputs.is_beta == '0'
        shell: pwsh
        run: |
          $url = "https://github.com/SSLcom/CodeSignTool/releases/download/v1.3.2/CodeSignTool-v1.3.2.zip"
          $zip = Join-Path $env:RUNNER_TEMP "CodeSignTool.zip"
          $dest = Join-Path $env:RUNNER_TEMP "CodeSignTool"
          Invoke-WebRequest -Uri $url -OutFile $zip
          # The tool is handed the eSigner secrets: only the pinned zip runs.
          $got = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne "f14b1e1ef14bfa1fd00279c363aab0debbf5dcfba0e4bcdce5d22bb771de0e3a") { throw "CodeSignTool v1.3.2: SHA-256 $got does not match the pinned f14b1e1ef14bfa1fd00279c363aab0debbf5dcfba0e4bcdce5d22bb771de0e3a" }
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          "CODE_SIGN_TOOL_DIR=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Pre-release tags (e.g. v1.4.0-beta.1) skip the MSI bundle
      # on Windows: the MSI bundler rejects non-numeric pre-release
      # identifiers. NSIS has no such restriction.
      - name: Compute Tauri bundle args
        id: tauri_args
        shell: bash
        run: |
          EXTRA=""
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$RUNNER_OS" == "Windows" ]] && [[ "$VERSION" == *-* ]]; then
            EXTRA=" --bundles nsis"
            echo "Pre-release detected ($VERSION), skipping MSI bundle on Windows"
          fi
          # rpm versions cannot carry a hyphen either; the bundler refuses them.
          if [[ "$RUNNER_OS" == "Linux" ]] && [[ "$VERSION" == *-* ]]; then
            EXTRA=" --bundles deb"
            echo "Pre-release detected ($VERSION), skipping rpm bundle on Linux"
          fi
          echo "extra=$EXTRA" >> "$GITHUB_OUTPUT"

      # Build + sign. The Apple and ESIGNER secrets below are read by
      # tauri-action; absent secrets produce unsigned bundles. The
      # `APPLE_SIGNING_IDENTITY: '-'` fallback when not on macOS keeps
      # tauri-action's signing step from erroring on Linux/Windows.
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The updater's own signature on each updater file (the public key
          # is in tauri.conf.json). Only release builds make updater files
          # (tauri.updater.conf.json below); test and local builds don't.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # sign-windows.ps1 no-ops when this is 1 (betas skip signing).
          STARTER_SKIP_WINDOWS_SIGNING: ${{ steps.prerelease.outputs.is_beta }}
          # Default the signing identity to '-' (ad-hoc) when not on
          # macOS or when the secret isn't configured. tauri-action's
          # macOS sign step errors otherwise.
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && env.MACOS_SIGNING_IDENTITY != '' && env.MACOS_SIGNING_IDENTITY || '-' }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # The version file is written after the renames (publish-release),
          # so its links are the final names.
          includeUpdaterJson: false
          args: --target ${{ matrix.target }} --config src-tauri/tauri.updater.conf.json${{ steps.tauri_args.outputs.extra }}

      # The two sidecars' SHA-256 as they ship (after code signing; macOS
      # signs them at bundle time, so they differ from the upstream pins),
      # read from inside the final package and published beside the
      # downloads. A later release compiles them into its kit descriptors
      # (`KitBinary::accepted`), so a restored binary is checked against a
      # hash from a signed release, not a build log.
      - name: Sidecar hashes after signing
        shell: bash
        run: node scripts/kit-hashes.mjs "${{ matrix.target }}" "src-tauri/target/${{ matrix.target }}/release/bundle" "kit-hashes-${{ matrix.target }}.json"

      - name: Publish the sidecar hashes
        uses: actions/github-script@v8
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
          file: kit-hashes-${{ matrix.target }}.json
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const release_id = Number(process.env.release_id);
            const name = process.env.file;
            const { data: assets } = await github.rest.repos.listReleaseAssets({ owner, repo, release_id, per_page: 100 });
            for (const a of assets) {
              if (a.name === name) await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: a.id });
            }
            await github.rest.repos.uploadReleaseAsset({ owner, repo, release_id, name, data: fs.readFileSync(name) });

      - name: Dump Windows signing transcript on failure
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "sign-windows.log"
          if (Test-Path $log) {
            Write-Host "===== sign-windows.log ====="
            Get-Content $log
            Write-Host "===== end log ====="
          } else {
            Write-Host "No sign-windows.log at $log"
          }

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Rename release assets
        uses: actions/github-script@v8
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const releaseId = process.env.release_id;
            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
            });

            // Tauri's auto-update tarballs ship without the version in
            // their filename ("My.App_aarch64.app.tar.gz"); inject it
            // in the rename so they end up consistent with the .dmg
            // naming.
            const version = context.ref.replace('refs/tags/v', '');

            const renames = {
              '_aarch64.dmg': '-macOS-Apple-Silicon.dmg',
              '_x64.dmg': '-macOS-Intel.dmg',
              '_amd64.deb': '-Linux.deb',
              '-1.x86_64.rpm': '-Linux.rpm',
              '_x64-setup.exe': '-Windows-Setup.exe',
              '_x64_en-US.msi': '-Windows.msi',
              '_aarch64.app.tar.gz': `_${version}-macOS-Apple-Silicon.app.tar.gz`,
              '_x64.app.tar.gz': `_${version}-macOS-Intel.app.tar.gz`,
              '_aarch64.app.tar.gz.sig': `_${version}-macOS-Apple-Silicon.app.tar.gz.sig`,
              '_x64.app.tar.gz.sig': `_${version}-macOS-Intel.app.tar.gz.sig`,
              '_x64-setup.exe.sig': '-Windows-Setup.exe.sig',
              '_x64_en-US.msi.sig': '-Windows.msi.sig',
              '_amd64.deb.sig': '-Linux.deb.sig',
              '-1.x86_64.rpm.sig': '-Linux.rpm.sig',
            };

            for (const asset of assets) {
              for (const [oldSuffix, newSuffix] of Object.entries(renames)) {
                if (asset.name.endsWith(oldSuffix)) {
                  const newName = asset.name.replace(oldSuffix, newSuffix);
                  console.log(`Renaming: ${asset.name} → ${newName}`);
                  await github.rest.repos.updateReleaseAsset({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    asset_id: asset.id,
                    name: newName,
                  });
                  break;
                }
              }
            }

      # The updater's version file (Tauri's latest.json), written after the
      # renames so its links are the final download names: each platform's
      # updater file and the content of its .sig. Two keys per platform: the
      # updater looks for <os>-<arch>-<installer> first, then <os>-<arch>.
      # The app reads it only after the release manifest (signed by your
      # release identity, scripts/release-manifest.mjs) names the same
      # version.
      # The links are built from the tag: the release is still a draft here,
      # and a draft asset's browser_download_url is a temporary untagged-...
      # address that stops working once the release is published.
      - name: Updater version file
        uses: actions/github-script@v8
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const release_id = Number(process.env.release_id);
            const version = context.ref.replace('refs/tags/v', '');
            const tag = context.ref.replace('refs/tags/', '');
            const { data: assets } = await github.rest.repos.listReleaseAssets({ owner, repo, release_id, per_page: 100 });
            const text = async (a) => Buffer.from((await github.request('GET /repos/{owner}/{repo}/releases/assets/{asset_id}', { owner, repo, asset_id: a.id, headers: { accept: 'application/octet-stream' } })).data).toString('utf8').trim();
            const files = [
              ['-macOS-Apple-Silicon.app.tar.gz', ['darwin-aarch64-app', 'darwin-aarch64']],
              ['-macOS-Intel.app.tar.gz', ['darwin-x86_64-app', 'darwin-x86_64']],
              ['-Windows-Setup.exe', ['windows-x86_64-nsis', 'windows-x86_64']],
              ['-Windows.msi', ['windows-x86_64-msi']],
              ['-Linux.deb', ['linux-x86_64-deb', 'linux-x86_64']],
              ['-Linux.rpm', ['linux-x86_64-rpm']],
            ];
            const platforms = {};
            for (const [suffix, keys] of files) {
              const file = assets.find((a) => a.name.endsWith(suffix));
              const sig = assets.find((a) => a.name.endsWith(`${suffix}.sig`));
              if (!file || !sig) { console.log(`no updater file for ${suffix}`); continue; }
              const signature = await text(sig);
              const url = `https://github.com/${owner}/${repo}/releases/download/${tag}/${encodeURIComponent(file.name)}`;
              for (const k of keys) platforms[k] = { signature, url };
            }
            if (Object.keys(platforms).length === 0) throw new Error('no updater files: is TAURI_SIGNING_PRIVATE_KEY set?');
            const latest = {
              version,
              notes: `https://github.com/${owner}/${repo}/releases/tag/v${version}`,
              pub_date: new Date().toISOString(),
              platforms,
            };
            for (const a of assets) {
              if (a.name === 'latest.json') await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: a.id });
            }
            await github.rest.repos.uploadReleaseAsset({ owner, repo, release_id, name: 'latest.json', data: JSON.stringify(latest, null, 2) + '\n' });
            console.log(`latest.json: ${version}, ${Object.keys(platforms).join(', ')}`);

      # Hash every published asset (after the renames above, so the names in
      # SHA256SUMS.txt match the final download filenames) and attach the
      # checksums file to the release. Lets users verify a downloaded binary
      # with `sha256sum -c SHA256SUMS.txt`.
      - name: Generate SHA256 checksums
        uses: actions/github-script@v8
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const crypto = require('crypto');
            const releaseId = Number(process.env.release_id);
            const { owner, repo } = context.repo;

            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner, repo, release_id: releaseId, per_page: 100,
            });

            // Drop a stale checksums file from a previous run so the re-upload
            // below doesn't collide on the asset name.
            for (const a of assets) {
              if (a.name === 'SHA256SUMS.txt') {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: a.id });
              }
            }

            const installer = (name) => /\.(dmg|deb|rpm|msi)$|-Setup\.exe$/.test(name);
            const lines = [];
            for (const a of assets) {
              if (!installer(a.name)) continue;
              const res = await github.request(
                'GET /repos/{owner}/{repo}/releases/assets/{asset_id}',
                { owner, repo, asset_id: a.id, headers: { accept: 'application/octet-stream' } }
              );
              const hash = crypto.createHash('sha256').update(Buffer.from(res.data)).digest('hex');
              lines.push(`${hash}  ${a.name}`);
              console.log(`${hash}  ${a.name}`);
            }
            lines.sort();

            await github.rest.repos.uploadReleaseAsset({
              owner, repo, release_id: releaseId,
              name: 'SHA256SUMS.txt',
              data: lines.join('\n') + '\n',
            });

      - name: Publish release
        uses: actions/github-script@v8
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id,
              draft: false,
            });
